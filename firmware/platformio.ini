; Run from this directory: pio run -e danger
[platformio]
src_dir = main
default_envs = danger

[env]
platform = espressif32@8.0.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
; Assumes the smallest module option, 4 MB. Module variant is README risk R1.
board_upload.flash_size = 4MB
monitor_speed = 115200

[env:danger]
build_flags = -DDANGER_MIRROR=1

; Screen mirror compiled out.
[env:danger-nomirror]
build_flags = -DDANGER_MIRROR=0
